name: CD - Deploy Brain Tumor App to Azure

# Deploy only after the CI workflow has passed for a push to main.
# Can also be triggered manually from the Actions tab.
on:
  workflow_run:
    workflows: ["Brain Tumor MRI CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write # push images to ghcr.io
  id-token: write # OIDC login to Azure

concurrency:
  group: cd-azure
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
  RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  ACI_NAME: ${{ vars.ACI_NAME }}

jobs:
  build-and-deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.IMAGE_TAG }}
          lfs: true # model weights (*.pth) are stored in Git LFS

      - name: Verify model weights were downloaded
        run: |
          for f in models/*.pth; do
            size=$(stat -c%s "$f")
            echo "$f: $size bytes"
            if [ "$size" -lt 1000000 ]; then
              echo "::error::$f looks like a Git LFS pointer, not the real model file"
              exit 1
            fi
          done

      - name: Set image names
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "OWNER=$OWNER" >> "$GITHUB_ENV"
          echo "BACKEND_IMAGE=${{ env.REGISTRY }}/$OWNER/brain-tumor-api:${{ env.IMAGE_TAG }}" >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE=${{ env.REGISTRY }}/$OWNER/brain-tumor-frontend:${{ env.IMAGE_TAG }}" >> "$GITHUB_ENV"

      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u "${{ github.actor }}" --password-stdin

      - name: Build and push backend image
        run: |
          docker build -f Dockerfile -t "$BACKEND_IMAGE" .
          docker push "$BACKEND_IMAGE"

      - name: Build and push frontend image
        run: |
          docker build -f Dockerfile.frontend -t "$FRONTEND_IMAGE" .
          docker push "$FRONTEND_IMAGE"

      - name: Login to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Backend and frontend run in one container group, so the frontend
      # reaches the API over localhost. Both ports are exposed publicly.
      - name: Deploy to Azure Container Instances
        run: |
          LOCATION=$(az group show --name "$RESOURCE_GROUP" --query location -o tsv)
          DNS_LABEL=$(echo "$ACI_NAME-$OWNER" | tr '[:upper:]' '[:lower:]')
          echo "DNS_LABEL=$DNS_LABEL" >> "$GITHUB_ENV"

          cat > aci.yaml <<EOF
          apiVersion: 2021-10-01
          location: $LOCATION
          name: $ACI_NAME
          type: Microsoft.ContainerInstance/containerGroups
          properties:
            osType: Linux
            restartPolicy: Always
            imageRegistryCredentials:
              - server: ${{ env.REGISTRY }}
                username: '$OWNER'
                password: '${{ secrets.GHCR_TOKEN }}'
            ipAddress:
              type: Public
              dnsNameLabel: $DNS_LABEL
              ports:
                - protocol: tcp
                  port: 8000
                - protocol: tcp
                  port: 8501
            containers:
              - name: backend
                properties:
                  image: $BACKEND_IMAGE
                  ports:
                    - port: 8000
                  resources:
                    requests:
                      cpu: 2
                      memoryInGB: 4
              - name: frontend
                properties:
                  image: $FRONTEND_IMAGE
                  ports:
                    - port: 8501
                  environmentVariables:
                    - name: BACKEND_URL
                      value: http://localhost:8000
                  resources:
                    requests:
                      cpu: 1
                      memoryInGB: 1.5
          EOF

          ACI=(--resource-group "$RESOURCE_GROUP" --name "$ACI_NAME")

          CURRENT=$(az container show "${ACI[@]}" \
            --query "join(',', [provisioningState, containers[?name=='backend'].image | [0], containers[?name=='frontend'].image | [0]])" \
            -o tsv 2>/dev/null || true)

          if [ "$CURRENT" = "Succeeded,$BACKEND_IMAGE,$FRONTEND_IMAGE" ]; then
            # Same images already deployed and healthy: reuse as-is.
            echo "Container group '$ACI_NAME' already runs these images; skipping deploy."
          elif [ -n "$CURRENT" ]; then
            # Group exists: update it in place (keeps the same IP and DNS name).
            # ACI rejects in-place changes to things like CPU/memory, so fall
            # back to delete + create only when the update itself is refused.
            echo "Updating existing container group '$ACI_NAME' in place..."
            if ! az container create --resource-group "$RESOURCE_GROUP" --file aci.yaml --no-wait --output none; then
              echo "::warning::In-place update refused; recreating the container group."
              az container delete "${ACI[@]}" --yes --output none
              az container create --resource-group "$RESOURCE_GROUP" --file aci.yaml --no-wait --output none
            fi
          else
            echo "Creating container group '$ACI_NAME'..."
            az container create --resource-group "$RESOURCE_GROUP" --file aci.yaml --no-wait --output none
          fi
          rm -f aci.yaml

          # Poll instead of blocking, so a stuck deploy shows why and fails
          # after 15 minutes rather than hanging the workflow.
          for i in $(seq 1 45); do
            STATUS=$(az container show "${ACI[@]}" \
              --query "join(' | ', [provisioningState, containers[?name=='backend'].image | [0], containers[?name=='backend'].instanceView.currentState.state | [0] || 'n/a', to_string(containers[?name=='backend'].instanceView.restartCount | [0] || \`0\`)])" \
              -o tsv 2>/dev/null || echo "not visible yet")
            echo "[$i] provisioning | backend image | backend state | restarts = $STATUS"

            IFS='|' read -r PROV IMG STATE RESTARTS <<< "$(echo "$STATUS" | tr -d ' ')"
            if [ "$PROV" = "Succeeded" ] && [ "$IMG" = "$BACKEND_IMAGE" ] && [ "$STATE" = "Running" ]; then
              break
            fi
            # Only count restarts once the new image is in place, so a crash
            # loop left over from a previous deploy doesn't fail this one.
            if [ "$PROV" = "Failed" ] || { [ "$IMG" = "$BACKEND_IMAGE" ] && [ "${RESTARTS:-0}" -ge 3 ] 2>/dev/null; }; then
              echo "::error::Container group failed to start (provisioning=$PROV, backend restarts=$RESTARTS)"
              az container show "${ACI[@]}" --query "containers[].instanceView.events[-5:].{container:name, event:name, message:message}" -o table || true
              az container logs "${ACI[@]}" --container-name backend || true
              exit 1
            fi
            if [ "$i" = 45 ]; then
              echo "::error::Container group not running after 15 minutes"
              az container show "${ACI[@]}" --query "containers[].instanceView.events[-5:].{container:name, event:name, message:message}" -o table || true
              exit 1
            fi
            sleep 20
          done

          FQDN=$(az container show "${ACI[@]}" --query ipAddress.fqdn -o tsv)
          echo "FQDN=$FQDN" >> "$GITHUB_ENV"
          echo "Frontend: http://$FQDN:8501"
          echo "Backend:  http://$FQDN:8000/docs"

      - name: Wait for backend to come up
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://$FQDN:8000/docs" || true)
            echo "Attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then
              echo "### Deployed :rocket:" >> "$GITHUB_STEP_SUMMARY"
              echo "- Frontend: http://$FQDN:8501" >> "$GITHUB_STEP_SUMMARY"
              echo "- Backend: http://$FQDN:8000/docs" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 20
          done
          echo "::error::Backend did not respond within 10 minutes"
          az container logs --resource-group "$RESOURCE_GROUP" --name "$ACI_NAME" --container-name backend || true
          exit 1

      - name: Azure logout
        if: always()
        run: az logout || true
