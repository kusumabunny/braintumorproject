name: Brain Tumor MRI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install pytest==9.2.0 httpx ruff==0.17.3 mypy==2.4.1

      - name: Check Python syntax
        run: python -m compileall backend frontend tests test_models.py test_prediction.py

      - name: Lint code
        run: ruff check backend frontend

      - name: Type check
        run: mypy backend

      - name: Run tests
        run: pytest -q

      - name: Build backend Docker image
        run: docker build -f Dockerfile -t brain-tumor-backend .

      - name: Build frontend Docker image
        run: docker build -f Dockerfile.frontend -t brain-tumor-frontend .
